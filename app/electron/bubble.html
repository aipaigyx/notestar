<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:;">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14101F; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }

  /* ===== 收起态：只显示球 ===== */
  #shell { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #ball {
    width: 48px; height: 48px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFB8CF 0%, #FF6B9D 45%, #B794F6 100%);
    box-shadow: 0 4px 16px rgba(255, 107, 157, 0.5), inset 0 0 0 2px rgba(255, 255, 255, 0.35);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  #ball:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(255, 107, 157, 0.65), inset 0 0 0 2px rgba(255,255,255,0.45); }
  #ball .face { font-size: 22px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15)); }
  #ball.recording { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 4px 16px rgba(255,107,157,0.5), 0 0 0 0 rgba(255,107,157,0.5); } 50% { box-shadow: 0 4px 16px rgba(255,107,157,0.5), 0 0 0 10px rgba(255,107,157,0); } }

  /* ===== 展开态：操作面板 ===== */
  #panel {
    position: fixed; inset: 0; display: none; flex-direction: column;
    background: linear-gradient(165deg, #2A2340 0%, #14101F 70%);
    border-radius: 18px; padding: 16px 12px 10px;
  }
  #panel.open { display: flex; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 12px; }
  .panel-title { font-size: 13px; font-weight: 800; color: #FFB8CF; letter-spacing: 0.5px; }
  .panel-ball {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFB8CF 0%, #FF6B9D 45%, #B794F6 100%);
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px;
    box-shadow: 0 2px 10px rgba(255,107,157,0.5);
  }
  .panel-ball.recording { animation: pulse 1s ease-in-out infinite; }
  .menu-item {
    display: flex; align-items: center; gap: 11px; padding: 12px 12px; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: #E9E4F5; cursor: pointer; transition: background 0.15s; margin-bottom: 2px;
  }
  .menu-item:hover { background: rgba(255, 107, 157, 0.14); }
  .menu-item .icon { font-size: 16px; }
  .menu-item.sub { font-size: 11.5px; color: #8F8AB0; margin-top: 6px; justify-content: center; padding: 9px; }
  .menu-item.sub:hover { background: rgba(255, 107, 157, 0.08); color: #FFB8CF; }

  /* 状态条 */
  #status {
    position: fixed; left: 8px; top: 8px; width: 48px; height: 48px; border-radius: 50%;
    background: rgba(33, 26, 77, 0.88); color: #fff; font-size: 9px; line-height: 1.3;
    display: none; align-items: center; justify-content: center; text-align: center; z-index: 30;
  }
</style>
</head>
<body>
  <!-- 收起态：球 -->
  <div id="shell">
    <div id="ball" title="笔记星图"><span class="face">🎀</span></div>
  </div>

  <!-- 展开态：操作面板 -->
  <div id="panel">
    <div class="panel-head">
      <span class="panel-title">✦ 笔记星图</span>
      <div id="panel-ball" class="panel-ball" title="收起">🎀</div>
    </div>
    <div class="menu-item" id="mi-voice"><span class="icon">🎤</span>语音转文字笔记</div>
    <div class="menu-item" id="mi-shot"><span class="icon">📸</span>截图添加到笔记</div>
    <div class="menu-item" id="mi-open"><span class="icon">📂</span>打开主界面</div>
    <div class="menu-item sub" id="mi-quit">退出笔记星图</div>
  </div>

  <div id="status"></div>

<script>
  const shell = document.getElementById('shell')
  const ball = document.getElementById('ball')
  const panel = document.getElementById('panel')
  const statusBox = document.getElementById('status')
  const api = window.noteAPI

  let expanded = false

  // 展开面板（窗口同时放大）
  async function expand() {
    expanded = true
    shell.style.display = 'none'
    panel.classList.add('open')
    try { await api.expandBubble() } catch (e) { /* ignore */ }
  }
  // 收起面板（窗口缩回小球）
  async function collapse() {
    expanded = false
    panel.classList.remove('open')
    shell.style.display = 'flex'
    try { await api.collapseBubble() } catch (e) { /* ignore */ }
  }

  ball.addEventListener('click', expand)
  document.getElementById('panel-ball').addEventListener('click', collapse)

  function setStatus(text) {
    statusBox.style.display = 'flex'
    statusBox.textContent = text
  }
  function clearStatus() {
    statusBox.style.display = 'none'
  }
  function toast(text, ms = 1800) {
    statusBox.style.display = 'flex'
    statusBox.textContent = text
    clearTimeout(toast._t)
    toast._t = setTimeout(() => { statusBox.style.display = 'none' }, ms)
  }

  // 新建笔记（悬浮球独立于主界面，直接创建新笔记）
  async function createNote(title, content) {
    try {
      await api.saveNote({
        title: title || '快速笔记',
        courseId: '',
        tags: [],
        content: content || '',
      })
      toast('✓ 已保存到笔记')
    } catch (e) {
      toast('✕ 保存失败')
    }
  }

  // ===== 语音转文字 =====
  let recorder = null
  let chunks = []
  let stream = null
  document.getElementById('mi-voice').addEventListener('click', async () => {
    if (recorder && recorder.state === 'recording') { // 再次点击停止
      recorder.stop()
      return
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true })
      const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : ''
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined)
      chunks = []
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data) }
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop())
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' })
        const buf = await blob.arrayBuffer()
        recorder = null
        ball.classList.remove('recording')
        document.getElementById('panel-ball').classList.remove('recording')
        setStatus('转写中…')
        try {
          const text = await api.transcribeAudio(buf)
          clearStatus()
          if (!text || !text.trim()) { toast('未识别到语音'); return }
          const firstLine = text.trim().split('\n')[0].slice(0, 20)
          await createNote(`语音笔记 ${new Date().toLocaleTimeString()}`, text.trim())
        } catch (err) {
          clearStatus(); toast('✕ 转写失败')
        }
      }
      recorder.start()
      ball.classList.add('recording')
      document.getElementById('panel-ball').classList.add('recording')
      toast('● 录音中… 再点菜单停止', 2500)
    } catch (err) {
      toast('✕ 无法使用麦克风')
    }
  })

  // ===== 截图添加到笔记 =====
  document.getElementById('mi-shot').addEventListener('click', async () => {
    setStatus('截屏中…')
    try {
      const shot = await api.captureScreen({ mode: 'foreground' })
      const src = await api.saveImage(shot.dataUri)
      const md = `## 📸 屏幕截图 ${new Date().toLocaleString()}\n\n![截图](${src})\n`
      await createNote(`截图笔记 ${new Date().toLocaleTimeString()}`, md)
      clearStatus()
      collapse()
    } catch (err) {
      clearStatus(); toast('✕ 截图失败')
    }
  })

  // ===== 打开主界面 =====
  document.getElementById('mi-open').addEventListener('click', async () => {
    try { await api.showMainWindow() } catch (e) { /* ignore */ }
    collapse()
  })

  // ===== 退出 =====
  document.getElementById('mi-quit').addEventListener('click', async () => {
    try { await api.quitApp() } catch (e) { /* ignore */ }
  })

  // 点击空白处收起（点击面板自身背景）
  panel.addEventListener('click', (e) => {
    if (e.target === panel) collapse()
  })
</script>
</body>
</html>
