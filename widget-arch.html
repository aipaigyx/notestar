<style>
  :root {
    --text: #1f2937;
    --text-muted: #6b7280;
    --surface: #ffffff;
    --surface-muted: #f9fafb;
    --border: #d1d5db;
    --brand: #7c3aed;
    --brand-muted: #ede9fe;
    --radius-card: 12px;
    --radius: 8px;
  }
  :root[data-widget-theme="dark"] {
    --text: #f3f4f6;
    --text-muted: #9ca3af;
    --surface: #111827;
    --surface-muted: #1f2937;
    --border: #374151;
    --brand: #a78bfa;
    --brand-muted: #2e1065;
  }
  .na-root { width:100%; font-family: system-ui, sans-serif; }
  .na-title { font-size:14px; font-weight:600; color:var(--text); text-align:center; margin-bottom:4px; }
  .na-subtitle { font-size:12px; color:var(--text-muted); text-align:center; margin-bottom:12px; }
  .na-legend { display:flex; gap:16px; justify-content:center; margin-top:12px; font-size:12px; color:var(--text-muted); }
  .na-legend-item { display:flex; align-items:center; gap:6px; }
  .na-legend-box { width:14px; height:14px; border-radius:4px; }
</style>
<div class="na-root" data-dynamic-ui-widget data-template="architecture-elements">
  <div class="na-title">NoteStar 模块依赖架构</div>
  <div class="na-subtitle">按进程分层 + 模块间真实调用关系</div>
  <svg viewBox="0 0 720 476" width="100%" height="auto" role="img" aria-label="模块依赖架构图">
    <defs>
      <marker id="na-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M1 1 L7 4 L1 7 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      </marker>
      <marker id="na-arrow-brand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M1 1 L7 4 L1 7 Z" fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- 渲染层 boundary -->
    <rect x="28" y="52" width="220" height="84" rx="12" fill="none" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="40" y="68" font-size="12" fill="var(--text-muted)" font-weight="600">渲染层</text>
    <rect x="44" y="70" width="120" height="28" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="56" y="88" font-size="13" fill="var(--text)">store.ts</text>
    <rect x="44" y="108" width="120" height="28" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="56" y="126" font-size="13" fill="var(--text)">Vue 页面</text>

    <!-- IPC桥 boundary -->
    <rect x="28" y="144" width="220" height="40" rx="12" fill="none" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="40" y="160" font-size="12" fill="var(--text-muted)" font-weight="600">IPC 桥</text>
    <rect x="108" y="152" width="140" height="24" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="120" y="168" font-size="13" fill="var(--text)">preload.js</text>

    <!-- 主进程核心 boundary -->
    <rect x="284" y="52" width="408" height="300" rx="12" fill="none" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="296" y="68" font-size="12" fill="var(--text-muted)" font-weight="600">主进程核心 (main.cjs)</text>

    <!-- main.cjs brand block -->
    <rect x="300" y="70" width="376" height="40" rx="8" fill="var(--brand)" fill-opacity="0.12" stroke="var(--brand)" stroke-width="1.4"/>
    <text x="312" y="94" font-size="14" font-weight="700" fill="var(--brand)">main.cjs · 聚合根（4273 行，96 个 IPC handler）</text>

    <!-- 支撑模块 neutral blocks (row 1) -->
    <rect x="300" y="124" width="120" height="28" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="312" y="142" font-size="13" fill="var(--text)">storage.cjs</text>
    <rect x="428" y="124" width="120" height="28" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="440" y="142" font-size="13" fill="var(--text)">embed.cjs</text>
    <rect x="556" y="124" width="132" height="28" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="568" y="142" font-size="13" fill="var(--text)">callAI.cjs</text>

    <!-- 支撑模块 neutral blocks (row 2) -->
    <rect x="300" y="168" width="120" height="28" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="312" y="186" font-size="13" fill="var(--text)">exportHtml.cjs</text>
    <rect x="428" y="168" width="120" height="28" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="440" y="186" font-size="13" fill="var(--text)">auto-updater</text>
    <rect x="556" y="168" width="132" height="28" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="568" y="186" font-size="13" fill="var(--text)">transcribe.py</text>

    <!-- 外部系统 boundary -->
    <rect x="284" y="208" width="408" height="144" rx="12" fill="none" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="296" y="224" font-size="12" fill="var(--text-muted)" font-weight="600">外部系统</text>

    <rect x="300" y="236" width="156" height="28" rx="8" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="312" y="254" font-size="13" fill="var(--text-muted)">Ollama (本地)</text>
    <rect x="468" y="236" width="156" height="28" rx="8" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="480" y="254" font-size="13" fill="var(--text-muted)">云端 AI API</text>
    <rect x="636" y="236" width="56" height="28" rx="8" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="648" y="254" font-size="13" fill="var(--text-muted)">GitHub</text>

    <rect x="300" y="280" width="120" height="28" rx="8" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="312" y="298" font-size="13" fill="var(--text-muted)">本地文件</text>
    <rect x="432" y="280" width="192" height="28" rx="8" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="444" y="298" font-size="13" fill="var(--text-muted)">操作系统 / Electron runtime</text>

    <!-- 连接器 1: 渲染层→IPC桥 neutral solid -->
    <path d="M138 136 L138 144" fill="none" stroke="var(--text-muted)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#na-arrow)" style="color:var(--text-muted)"/>

    <!-- 连接器 2: IPC桥→main.cjs brand solid（核心调用路径） -->
    <path d="M248 164 L270 164 L270 90 L284 90" fill="none" stroke="var(--brand)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#na-arrow-brand)" style="color:var(--brand)"/>

    <!-- 连接器 3: main.cjs→storage.cjs neutral solid -->
    <path d="M488 110 L360 124" fill="none" stroke="var(--text-muted)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#na-arrow)" style="color:var(--text-muted)"/>

    <!-- 连接器 4: main.cjs→embed.cjs neutral solid -->
    <path d="M488 110 L488 124" fill="none" stroke="var(--text-muted)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#na-arrow)" style="color:var(--text-muted)"/>

    <!-- 连接器 5: main.cjs→callAI.cjs neutral solid -->
    <path d="M488 110 L622 124" fill="none" stroke="var(--text-muted)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#na-arrow)" style="color:var(--text-muted)"/>

    <!-- 连接器 6: embed.cjs→Ollama neutral dashed（关键耦合点：embed 绕开 main 直连 Ollama） -->
    <path d="M488 152 L488 188 L378 188 L378 236" fill="none" stroke="var(--text-muted)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#na-arrow)" style="color:var(--text-muted)"/>

    <!-- 连接器 7: callAI.cjs→云端/Ollama neutral dashed -->
    <path d="M622 152 L622 188 L546 188 L546 236" fill="none" stroke="var(--text-muted)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#na-arrow)" style="color:var(--text-muted)"/>

    <!-- 连接器 8: storage.cjs→本地文件 neutral dashed -->
    <path d="M360 152 L360 188 L360 280" fill="none" stroke="var(--text-muted)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#na-arrow)" style="color:var(--text-muted)"/>
  </svg>
</div>
