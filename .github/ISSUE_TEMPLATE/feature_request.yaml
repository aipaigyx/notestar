name: ✨ 功能建议
description: 你希望笔记星图加什么新能力？
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 简单描述你想要的功能
      placeholder: 比如：希望加番茄钟模式切换、希望皮肤可以自定义颜色...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要它？
      placeholder: 它能帮你解决什么问题？
  - type: textarea
    id: mockup
    attributes:
      label: 大概长这样（可选）
      placeholder: 画个草图、贴个参考图都行